<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сыромания — натуральные сыры и молочная продукция</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#F5F1EB" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Цветовая схема - тёплые натуральные тона */
      --cream: #F5F1EB;
      --cream-light: #FFF9F0;
      --gold: #C9A962;
      --gold-light: #E8D5A3;
      --gold-pale: #F0E6C8;
      --brown-dark: #2C2416;
      --brown-medium: #5C4D3C;
      --brown-light: #8A7F6A;
      --border: #E2D4BD;
      --shadow-soft: 0 4px 20px rgba(0,0,0,0.04);
      --shadow-medium: 0 8px 30px rgba(0,0,0,0.08);
      --shadow-strong: 0 12px 40px rgba(0,0,0,0.12);
      
      /* Размеры */
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 999px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--cream);
      color: var(--brown-dark);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Скелетон-загрузка */
    .skeleton {
      background: linear-gradient(90deg, #E2D4BD 25%, #F0E6C8 50%, #E2D4BD 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-md);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Шапка */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(245, 241, 235, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      transition: all 0.3s ease;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--brown-dark);
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--gold), #B8954A);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: var(--shadow-soft);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--cream-light);
      border: 2px solid var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      color: var(--brown-medium);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .user-avatar:active {
      transform: scale(0.95);
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Поиск */
    .search-container {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      z-index: 99;
      background: rgba(245, 241, 235, 0.9);
      backdrop-filter: blur(10px);
      padding: 8px 16px 12px;
      border-bottom: 1px solid transparent;
      transition: all 0.3s;
    }

    .search-container.scrolled {
      border-bottom-color: var(--border);
      box-shadow: var(--shadow-soft);
    }

    .search-box {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--cream-light);
      font-size: 15px;
      font-family: inherit;
      color: var(--brown-dark);
      transition: all 0.3s;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 169, 98, 0.1);
    }

    .search-input::placeholder {
      color: var(--brown-light);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--brown-light);
      font-size: 18px;
    }

    /* Основной контент */
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 140px 16px 100px;
      min-height: 100vh;
    }

    /* Хиты продаж */
    .hits-section {
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--brown-dark);
      margin: 0;
    }

    .see-all {
      font-size: 13px;
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hits-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 4px 4px 12px;
      margin: 0 -4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .hits-scroll::-webkit-scrollbar {
      display: none;
    }

    .hit-card {
      flex: 0 0 280px;
      scroll-snap-align: start;
      background: var(--cream-light);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
    }

    .hit-card:active {
      transform: scale(0.98);
    }

    .hit-card:hover {
      box-shadow: var(--shadow-medium);
    }

    .hit-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: linear-gradient(135deg, #E74C3C, #C0392B);
      color: white;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
    }

    .hit-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: linear-gradient(135deg, #E2D4BD, #F0E6C8);
    }

    .hit-content {
      padding: 16px;
    }

    .hit-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--brown-dark);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hit-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
    }

    /* Категории */
    .categories-section {
      margin-bottom: 24px;
      position: sticky;
      top: 120px;
      z-index: 98;
      background: var(--cream);
      padding: 8px 0;
    }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-tab {
      flex: 0 0 auto;
      scroll-snap-align: start;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--cream-light);
      font-size: 14px;
      font-weight: 500;
      color: var(--brown-medium);
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
      user-select: none;
    }

    .category-tab.active {
      background: linear-gradient(135deg, var(--gold), #B8954A);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(201, 169, 98, 0.3);
    }

    .category-tab:active {
      transform: scale(0.95);
    }

    /* Сетка товаров */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 1024px) {
      .products-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .product-card {
      background: var(--cream-light);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-medium);
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: linear-gradient(135deg, #E2D4BD, #F0E6C8);
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .product-card:hover .product-image {
      transform: scale(1.05);
    }

    .fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: var(--brown-light);
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 2;
    }

    .fav-btn:hover {
      transform: scale(1.1);
    }

    .fav-btn.active {
      color: #E74C3C;
      background: rgba(231, 76, 60, 0.1);
    }

    .quick-add {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #B8954A);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(201, 169, 98, 0.4);
      z-index: 2;
    }

    .product-card:hover .quick-add,
    .product-card:focus-within .quick-add {
      opacity: 1;
      transform: translateY(0);
    }

    .quick-add:active {
      transform: scale(0.9);
    }

    .product-info {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--brown-dark);
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
      min-height: 40px;
    }

    .product-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--gold);
      margin-top: auto;
    }

    .product-unit {
      font-size: 12px;
      color: var(--brown-light);
      font-weight: 400;
    }

    /* Модалка товара */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(44, 36, 22, 0.6);
      backdrop-filter: blur(8px);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .product-modal {
      background: var(--cream-light);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .product-modal {
      transform: translateY(0);
    }

    @media (min-width: 640px) {
      .modal-overlay {
        align-items: center;
        padding: 20px;
      }
      .product-modal {
        border-radius: var(--radius-lg);
        max-height: 85vh;
      }
    }

    .modal-header {
      position: relative;
      flex-shrink: 0;
    }

    .modal-image {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      background: linear-gradient(135deg, #E2D4BD, #F0E6C8);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: var(--brown-dark);
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s;
      z-index: 10;
    }

    .modal-close:active {
      transform: scale(0.9);
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--brown-dark);
      margin-bottom: 8px;
    }

    .modal-description {
      font-size: 14px;
      color: var(--brown-medium);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* Таблетки веса */
    .weight-section {
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--brown-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .weight-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .weight-pill {
      padding: 10px 20px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--border);
      background: var(--cream);
      font-size: 14px;
      font-weight: 600;
      color: var(--brown-medium);
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .weight-pill:hover {
      border-color: var(--gold-light);
    }

    .weight-pill.active {
      background: linear-gradient(135deg, var(--gold), #B8954A);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(201, 169, 98, 0.3);
    }

    /* Варианты (вкусы/виды) */
    .variants-section {
      margin-bottom: 20px;
    }

    .variant-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .variant-tabs::-webkit-scrollbar {
      display: none;
    }

    .variant-tab {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--border);
      background: var(--cream);
      font-size: 13px;
      font-weight: 500;
      color: var(--brown-medium);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .variant-tab.active {
      background: var(--brown-dark);
      color: var(--cream-light);
      border-color: var(--brown-dark);
    }

    /* Слайдер веса */
    .custom-weight-section {
      margin-bottom: 20px;
      padding: 16px;
      background: var(--cream);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .range-slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      -webkit-appearance: none;
      margin: 10px 0;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #B8954A);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(201, 169, 98, 0.4);
      border: 2px solid white;
    }

    .range-slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #B8954A);
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(201, 169, 98, 0.4);
    }

    .weight-input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .weight-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      background: white;
      color: var(--brown-dark);
    }

    .weight-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    /* Цена */
    .price-section {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 20px 0;
      padding: 16px;
      background: linear-gradient(135deg, rgba(201, 169, 98, 0.1), rgba(201, 169, 98, 0.05));
      border-radius: var(--radius-md);
      border: 1px solid rgba(201, 169, 98, 0.2);
    }

    .price-main {
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
    }

    .price-old {
      font-size: 16px;
      color: var(--brown-light);
      text-decoration: line-through;
    }

    .price-discount {
      font-size: 13px;
      color: #27AE60;
      font-weight: 600;
      margin-left: auto;
    }

    /* Кнопки действий */
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 16px 24px;
      border-radius: var(--radius-full);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-fav {
      background: var(--cream);
      color: var(--brown-dark);
      border: 1.5px solid var(--border);
      flex: 0 0 auto;
      width: 56px;
      padding: 0;
    }

    .btn-fav.active {
      background: rgba(231, 76, 60, 0.1);
      border-color: #E74C3C;
      color: #E74C3C;
    }

    /* Кнопка с растениями */
    .btn-plant {
      position: relative;
      background: linear-gradient(135deg, #82571c, #bd9952);
      color: white;
      overflow: hidden;
      height: 56px;
      flex: 1;
    }

    .btn-plant::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn-plant:hover::before {
      opacity: 1;
    }

    .leaves {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-pale));
      border-radius: 0 100% 0 100%;
      opacity: 0;
      transform: scale(0) rotate(0deg);
      transition: all 0.5s ease-out;
    }

    .btn-plant:hover .leaf,
    .btn-plant:focus .leaf {
      opacity: 0.8;
      transform: scale(1) rotate(45deg);
    }

    .leaf:nth-child(1) { left: 10%; top: 20%; transition-delay: 0s; }
    .leaf:nth-child(2) { left: 20%; top: 60%; transition-delay: 0.1s; width: 16px; height: 16px; }
    .leaf:nth-child(3) { right: 15%; top: 30%; transition-delay: 0.2s; width: 24px; height: 24px; }
    .leaf:nth-child(4) { right: 25%; top: 70%; transition-delay: 0.15s; width: 18px; height: 18px; }
    .leaf:nth-child(5) { left: 50%; top: 10%; transition-delay: 0.05s; width: 22px; height: 22px; }

    /* Нижняя навигация */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 249, 240, 0.98);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border: none;
      background: none;
      color: var(--brown-light);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;

      align-items: center;
      justify-content: center;

      visibility: hidden;
      transition: all 0.3s;

      opacity: 1;
      visibility: visible;

      display: flex;
      gap: 8px;

      align-items: center;
      gap: 8px;

      font-weight: 600;
      color: var(--brown-dark);

      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);

      height: 40px;
      border-radius: 50%;
      background: var(--cream-light);

      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: transform 0.3s;

    @keyframes rotate {

      to { transform: rotate(360deg); }

    let selectedWeight = 200;
    let selectedVariantIndex = 0;
    let checkoutState = { phone: '', address: '', comment: '', promo: '', city: 'Пенза' };
    
    // ===== ИНИЦИАЛИЗАЦИЯ =====
    document.addEventListener('DOMContentLoaded', init);
    
    function init() {
      loadState();
      setupTelegram();
      renderCategories();
      renderHits();
      renderProducts();
      updateUI();
      setupEventListeners();
      
      // Скролл для поиска
      window.addEventListener('scroll', () => {
        const searchContainer = document.getElementById('search-container');
        if (window.scrollY > 10) {
          searchContainer.classList.add('scrolled');
        } else {
          searchContainer.classList.remove('scrolled');
        }
      });
    }
    
    function setupTelegram() {
      if (window.Telegram?.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const user = tg.initDataUnsafe?.user;
        if (user) {
          const avatar = document.getElementById('user-avatar');
          const initial = (user.first_name || user.username || 'U').charAt(0).toUpperCase();
          avatar.innerHTML = user.photo_url 
            ? `<img src="${user.photo_url}" alt="" onerror="this.parentElement.innerHTML='<span>${initial}</span>'">`
            : `<span>${initial}</span>`;
        }
      }
    }
    
    function loadState() {
      try {
        const savedCart = localStorage.getItem(STORAGE_CART_KEY);
        if (savedCart) cart = JSON.parse(savedCart);
        
        const savedFav = localStorage.getItem(STORAGE_FAV_KEY);
        if (savedFav) favorites = new Set(JSON.parse(savedFav));
        
        const savedCheckout = localStorage.getItem(STORAGE_CHECKOUT_KEY);
        if (savedCheckout) checkoutState = { ...checkoutState, ...JSON.parse(savedCheckout) };
      } catch (e) {
        console.error('Error loading state:', e);
      }
    }
    
    function saveState() {
      try {
        localStorage.setItem(STORAGE_CART_KEY, JSON.stringify(cart));
        localStorage.setItem(STORAGE_FAV_KEY, JSON.stringify([...favorites]));
        localStorage.setItem(STORAGE_CHECKOUT_KEY, JSON.stringify(checkoutState));
      } catch (e) {
        console.error('Error saving state:', e);
      }
    }
    
    // ===== РЕНДЕРИНГ =====
    function renderCategories() {
      // Мобильные табы
      const scroll = document.getElementById('categories-scroll');
      scroll.innerHTML = GROUPS.map(g => `
        <button class="category-tab ${g.id === currentCategory ? 'active' : ''}" 
                onclick="setCategory('${g.id}')">
          ${g.title}
        </button>
      `).join('');
      
      // Десктопный сайдбар
      const sidebar = document.getElementById('sidebar-categories');
      if (sidebar) {
        sidebar.innerHTML = GROUPS.map(g => `
          <div class="sidebar-category ${g.id === currentCategory ? 'active' : ''}" 
               onclick="setCategory('${g.id}')">
            ${g.title}
          </div>
        `).join('');
      }
    }
    
    function renderHits() {
      const container = document.getElementById('hits-scroll');
      const hitProducts = HITS.map(id => {
        if (id === 'sandesh-combo') return PRODUCT_VARIANTS['sandesh-combo'];
        return PRODUCTS.find(p => p.id === id);
      }).filter(Boolean);
      
      container.innerHTML = hitProducts.map(p => `
        <div class="hit-card" onclick="openProductModal('${p.id}')">
          <div class="hit-badge">ХИТ</div>
          <img class="hit-image" src="${p.img || DEFAULT_IMG}" alt="" loading="lazy">
          <div class="hit-content">
            <div class="hit-name">${p.name}</div>
            <div class="hit-price">${getPriceText(p)}</div>
          </div>
        </div>
      `).join('');
    }
    
    function renderProducts() {
      const grid = document.getElementById('products-grid');
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      
      let filtered = PRODUCTS.filter(p => {
        const matchesCategory = currentCategory === 'all' || p.group === currentCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });
      
      // Скрываем секцию хитов если есть поиск или фильтр
      const hitsSection = document.getElementById('hits-section');
      const emptyState = document.getElementById('empty-state');
      
      if (searchTerm || currentCategory !== 'all') {
        hitsSection.classList.add('hidden');
      } else {
        hitsSection.classList.remove('hidden');
      }
      
      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      
      emptyState.classList.add('hidden');
      
      grid.innerHTML = filtered.map(p => {
        const isFav = favorites.has(p.id);
        return `
          <div class="product-card" onclick="openProductModal('${p.id}')" data-id="${p.id}">
            <div class="product-image-wrap">
              <img class="product-image skeleton" src="${p.img || DEFAULT_IMG}" 
                   alt="" loading="lazy" onload="this.classList.remove('skeleton')">
              <button class="fav-btn ${isFav ? 'active' : ''}" 
                      onclick="event.stopPropagation(); toggleFavorite('${p.id}')">
                ${isFav ? '♥' : '♡'}
              </button>
              <button class="quick-add" onclick="event.stopPropagation(); quickAdd('${p.id}')">
                +
              </button>
            </div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">
                ${getPriceText(p)}
                ${p.pricePerKg ? '<span class="product-unit">/ кг</span>' : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // ===== ДЕЙСТВИЯ =====
    function setCategory(id) {
      currentCategory = id;
      renderCategories();
      renderProducts();
      if (HAPTIC_ENABLED) window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('light');
    }
    
    function toggleFavorite(id) {
      if (favorites.has(id)) {
        favorites.delete(id);
        showToast('Удалено из избранного');
      } else {
        favorites.add(id);
        showToast('Добавлено в избранное');
      }
      saveState();
      renderProducts();
      updateBadges();
      if (HAPTIC_ENABLED) window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('medium');
    }
    
    function quickAdd(id) {
      // Быстрое добавление с дефолтным весом
      const product = PRODUCTS.find(p => p.id === id);
      if (!product) return;
      
      let variant = '200 г';
      const rule = VARIANT_RULES[id];
      
      if (rule) {
        if (rule.type === 'fixed') {
          variant = rule.options[0];
        } else if (rule.type === 'weight') {
          variant = `${rule.min} ${rule.unit}`;
        }
      } else if (product.pricePerL) {
        variant = '1 л';
      } else if (product.pricePerUnit) {
        variant = '1 шт';
      }
      
      addToCart(id, variant, 1);
      animateFlyToCart(event.target);
    }
    
    function openProductModal(id) {
      const product = PRODUCTS.find(p => p.id === id);
      if (!product) return;
      
      currentProduct = product;
      selectedVariantIndex = 0;
      
      // Проверяем, является ли товар комбо (с вариантами)
      if (product.isCombo && PRODUCT_VARIANTS[product.comboKey]) {
        currentVariant = PRODUCT_VARIANTS[product.comboKey];
        renderVariantTabs();
      } else {
        currentVariant = null;
        document.getElementById('variants-section').classList.add('hidden');
      }
      
      updateModalContent();
      document.getElementById('product-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
      
      if (HAPTIC_ENABLED) window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('medium');
    }
    
    function renderVariantTabs() {
      if (!currentVariant) return;
      
      const section = document.getElementById('variants-section');
      const tabs = document.getElementById('variant-tabs');
      
      section.classList.remove('hidden');
      tabs.innerHTML = currentVariant.variants.map((v, i) => `
        <button class="variant-tab ${i === selectedVariantIndex ? 'active' : ''}" 
                onclick="selectVariant(${i})">
          ${v.name}
        </button>
      `).join('');
    }
    
    function selectVariant(index) {
      selectedVariantIndex = index;
      renderVariantTabs();
      updateModalContent();
      if (HAPTIC_ENABLED) window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('light');
    }
    
    function updateModalContent() {
      if (!currentProduct) return;
      
      const variant = currentVariant?.variants?.[selectedVariantIndex];
      const displayProduct = variant || currentProduct;
      
      document.getElementById('modal-image').src = displayProduct.img || currentProduct.img || DEFAULT_IMG;
      document.getElementById('modal-title').textContent = currentProduct.name;
      document.getElementById('modal-description').textContent = currentProduct.description;
      
      // Обновляем кнопку избранного
      const favBtn = document.getElementById('modal-fav-btn');
      const isFav = favorites.has(currentProduct.id);
      favBtn.classList.toggle('active', isFav);
      favBtn.textContent = isFav ? '♥' : '♡';
      
      // Рендерим таблетки веса
      renderWeightPills();
      
      // Обновляем цену
      updateModalPrice();
    }
    
    function renderWeightPills() {
      const container = document.getElementById('weight-pills');
      const customSection = document.getElementById('custom-weight-section');
      const rule = VARIANT_RULES[currentProduct.id];
      
      container.innerHTML = '';
      
      if (rule) {
        if (rule.type === 'fixed') {
          customSection.classList.add('hidden');
          rule.options.forEach((opt, i) => {
            const pill = document.createElement('button');
            pill.className = `weight-pill ${i === 0 ? 'active' : ''}`;
            pill.textContent = opt;
            pill.onclick = () => selectWeightPill(pill, opt);
            container.appendChild(pill);
          });
        } else if (rule.type === 'weight') {
          // Весовые товары - показываем таблетки + слайдер
          const weights = [];
          for (let g = rule.min; g <= Math.min(rule.max, 1000); g += rule.step) {
            weights.push(g);
          }
          
          weights.forEach((g, i) => {
            const pill = document.createElement('button');
            pill.className = `weight-pill ${g === selectedWeight ? 'active' : ''}`;
            pill.textContent = `${g} г`;
            pill.onclick = () => {
              selectedWeight = g;
              renderWeightPills();
              updateModalPrice();
            };
            container.appendChild(pill);
          });
          
          // Слайдер для произвольного веса
          customSection.classList.remove('hidden');
          const slider = document.getElementById('weight-slider');
          const input = document.getElementById('weight-input');
          
          slider.min = rule.min;
          slider.max = Math.min(rule.max, 1000);
          slider.step = rule.step;
          slider.value = selectedWeight;
          input.value = selectedWeight;
          
          slider.oninput = (e) => {
            selectedWeight = parseInt(e.target.value);
            input.value = selectedWeight;
            updateModalPrice();
          };
          
          input.oninput = (e) => {
            let val = parseInt(e.target.value) || rule.min;
            val = Math.max(rule.min, Math.min(Math.min(rule.max, 1000), val));
            selectedWeight = val;
            slider.value = val;
            updateModalPrice();
          };
        }
      } else {
        // Дефолтные варианты
        customSection.classList.add('hidden');
        if (currentProduct.pricePerKg) {
          [200, 400, 600, 800, 1000].forEach((g, i) => {
            const pill = document.createElement('button');
            pill.className = `weight-pill ${g === selectedWeight ? 'active' : ''}`;
            pill.textContent = `${g} г`;
            pill.onclick = () => {
              selectedWeight = g;
              renderWeightPills();
              updateModalPrice();
            };
            container.appendChild(pill);
          });
        } else if (currentProduct.pricePerL) {
          ['0.5 л', '1 л'].forEach((opt, i) => {
            const pill = document.createElement('button');
            pill.className = `weight-pill ${i === 0 ? 'active' : ''}`;
            pill.textContent = opt;
            pill.onclick = () => selectWeightPill(pill, opt);
            container.appendChild(pill);
          });
        } else if (currentProduct.pricePerUnit) {
          const pill = document.createElement('button');
          pill.className = 'weight-pill active';
          pill.textContent = '1 шт';
          container.appendChild(pill);
        }
      }
    }
    
    function selectWeightPill(pill, value) {
      document.querySelectorAll('.weight-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      updateModalPrice();
    }
    
    function getSelectedVariant() {
      const activePill = document.querySelector('.weight-pill.active');
      if (activePill) {
        const text = activePill.textContent;
        if (text.includes('г') || text.includes('л') || text.includes('шт')) {
          return text;
        }
      }
      return `${selectedWeight} г`;
    }
    
    function updateModalPrice() {
      const variant = getSelectedVariant();
      const qty = 1;
      const price = calculatePrice(currentProduct.id, variant, qty);
      
      document.getElementById('modal-price').textContent = formatPrice(price.finalPrice);
      
      const oldPriceEl = document.getElementById('modal-old-price');
      const discountEl = document.getElementById('modal-discount');
      
      if (price.discountRate > 0) {
        oldPriceEl.textContent = formatPrice(price.basePrice);
        oldPriceEl.classList.remove('hidden');
        discountEl.textContent = `−${Math.round(price.discountRate * 100)}%`;
        discountEl.classList.remove('hidden');
      } else {
        oldPriceEl.classList.add('hidden');
        discountEl.classList.add('hidden');
      }
    }
    
    function closeProductModal() {
      document.getElementById('product-modal').classList.remove('active');
      document.body.style.overflow = '';
      currentProduct = null;
    }
    
    function toggleModalFavorite() {
      if (currentProduct) {
        toggleFavorite(currentProduct.id);
        const favBtn = document.getElementById('modal-fav-btn');
        const isFav = favorites.has(currentProduct.id);
        favBtn.classList.toggle('active', isFav);
        favBtn.textContent = isFav ? '♥' : '♡';
      }
    }
    
    function addToCartFromModal() {
      if (!currentProduct) return;
      
      const variant = getSelectedVariant();
      const variantData = currentVariant?.variants?.[selectedVariantIndex];
      const productId = variantData ? variantData.id : currentProduct.id;
      const productName = variantData ? `${currentProduct.name} (${variantData.name})` : currentProduct.name;
      
      addToCart(productId, variant, 1, productName);
      closeProductModal();
    }
    
    function addToCart(id, variant, qty, customName = null) {
      const existing = cart.find(item => item.id === id && item.variant === variant);
      
      if (existing) {
        existing.qty += qty;
      } else {
        const product = PRODUCTS.find(p => p.id === id) || 
                       Object.values(PRODUCT_VARIANTS).flatMap(v => v.variants).find(v => v.id === id);
        cart.push({
          id,
          name: customName || product?.name || id,
          variant,
          qty,
          group: product?.group || 'other'
        });
      }
      
      saveState();
      updateBadges();
      showToast('Добавлено в корзину');
      
      if (HAPTIC_ENABLED) window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('medium');
    }
    
    // ===== КОРЗИНА =====
    function openCart() {
      renderCart();
      document.getElementById('cart-sheet').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    
    function closeCart() {
      document.getElementById('cart-sheet').classList.remove('active');
      document.body.style.overflow = '';
    }
    
    function renderCart() {
      const container = document.getElementById('cart-items');
      
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🛒</div>
            <div class="empty-title">Корзина пуста</div>
            <p>Добавьте товары из каталога</p>
          </div>
        `;
        document.getElementById('cart-summary').innerHTML = '';
        return;
      }
      
      container.innerHTML = cart.map((item, index) => {
        const price = calculatePrice(item.id, item.variant, item.qty);
        const product = PRODUCTS.find(p => p.id === item.id) || 
                       Object.values(PRODUCT_VARIANTS).flatMap(v => v.variants).find(v => v.id === item.id);
        
        return `
          <div class="cart-item">
            <img class="cart-item-image" src="${product?.img || DEFAULT_IMG}" alt="">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-variant">${item.variant}</div>
              <div class="cart-item-price">${formatPrice(price.finalPrice)}</div>
            </div>
            <div class="cart-item-controls">
              <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
              <span>${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
            </div>
          </div>
        `;
      }).join('');
      
      // Сводка
      let total = 0;
      let baseTotal = 0;
      cart.forEach(item => {
        const price = calculatePrice(item.id, item.variant, item.qty);
        total += price.finalPrice;
        baseTotal += price.basePrice;
      });
      
      const discount = baseTotal - total;
      
      document.getElementById('cart-summary').innerHTML = `
        <div class="summary-row">
          <span>Сумма</span>
          <span>${formatPrice(baseTotal)}</span>
        </div>
        ${discount > 0 ? `
          <div class="summary-row discount">
            <span>Скидка</span>
            <span>−${formatPrice(discount)}</span>
          </div>
        ` : ''}
        <div class="summary-row total">
          <span>Итого</span>
          <span>${formatPrice(total)}</span>
        </div>
      `;
      
      // Заполняем сохранённые данные
      document.getElementById('checkout-phone').value = checkoutState.phone;
      document.getElementById('checkout-address').value = checkoutState.address;
      document.getElementById('checkout-comment').value = checkoutState.comment;
      document.getElementById('checkout-promo').value = checkoutState.promo;
      document.getElementById('checkout-city').value = checkoutState.city;
    }
    
    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      saveState();
      renderCart();
      updateBadges();
    }
    
    // ===== ОФОРМЛЕНИЕ ЗАКАЗА =====
    function submitOrder() {
      if (cart.length === 0) return;
      
      const phone = document.getElementById('checkout-phone').value.trim();
      const address = document.getElementById('checkout-address').value.trim();
      const comment = document.getElementById('checkout-comment').value.trim();
      const promo = document.getElementById('checkout-promo').value.trim().toUpperCase();
      const city = document.getElementById('checkout-city').value;
      
      checkoutState = { phone, address, comment, promo, city };
      saveState();
      
      if (!phone) {
        showToast('Укажите телефон');
        return;
      }
      if (!address) {
        showToast('Укажите адрес');
        return;
      }
      
      showLoader('Отправляем заказ...');
      
      const payload = {
        type: 'cart',
        source: 'miniapp',
        currency: CURRENCY,
        items: cart.map(item => {
          const price = calculatePrice(item.id, item.variant, item.qty);
          return {
            id: item.id,
            name: item.name,
            variant: item.variant,
            qty: item.qty,
            price: price.finalPrice / item.qty,
            total: price.finalPrice
          };
        }),
        total: cart.reduce((sum, item) => sum + calculatePrice(item.id, item.variant, item.qty).finalPrice, 0),
        contact: { phone, address, comment, promo, city },
        timestamp: Date.now()
      };
      
      if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
        payload.user = window.Telegram.WebApp.initDataUnsafe.user;
      }
      
      // Отправка
      if (typeof axios !== 'undefined') {
        axios.post(`${BACKEND}/order`, payload)
          .then(() => {
            hideLoader();
            showToast('Заказ отправлен!');
            cart = [];
            saveState();
            updateBadges();
            closeCart();
            setTimeout(() => {
              window.Telegram?.WebApp?.close?.();
            }, 1500);
          })
          .catch(err => {
            hideLoader();
            showToast('Ошибка отправки. Попробуйте ещё раз.');
            console.error(err);
          });
      } else {
        // Демо режим
        setTimeout(() => {
          hideLoader();
          showToast('Заказ отправлен! (демо)');
          console.log('ORDER:', payload);
          cart = [];
          saveState();
          updateBadges();
          closeCart();
        }, 1500);
      }
    }
    
    // ===== УТИЛИТЫ =====
    function calculatePrice(productId, variant, qty) {
      // Ищем продукт в основном списке или в вариантах
      let product = PRODUCTS.find(p => p.id === productId);
      if (!product) {
        // Ищем в комбо-вариантах
        for (const combo of Object.values(PRODUCT_VARIANTS)) {
          const variantProduct = combo.variants.find(v => v.id === productId);
          if (variantProduct) {
            product = { ...combo, ...variantProduct };
            break;
          }
        }
      }
      
      if (!product) return { basePrice: 0, finalPrice: 0, discountRate: 0 };
      
      let base = 0;
      
      if (product.pricePerKg) {
        const grams = extractGrams(variant) || 200;
        base = (grams / 1000) * product.pricePerKg * qty;
      } else if (product.pricePerL) {
        const liters = extractLiters(variant) || 1;
        base = liters * product.pricePerL * qty;
      } else if (product.pricePerUnit) {
        base = product.pricePerUnit * qty;
      }
      
      // Скидка только для сыров
      let discountRate = 0;
      if (CHEESE_GROUP_IDS.has(product.group)) {
        const totalGrams = cart
          .filter(i => i.id === productId)
          .reduce((sum, i) => sum + (extractGrams(i.variant) || 0) * i.qty, 0);
        
        for (const threshold of DISCOUNT_THRESHOLDS) {
          if (totalGrams >= threshold.g) discountRate = threshold.rate;
        }
      }
      
      return {
        basePrice: Math.round(base),
        finalPrice: Math.round(base * (1 - discountRate)),
        discountRate
      };
    }
    
    function extractGrams(variant) {
      const match = variant.match(/(\d+)\s*г/);
      return match ? parseInt(match[1]) : 0;
    }
    
    function extractLiters(variant) {
      const match = variant.match(/(\d+(?:\.\d+)?)\s*л/);
      return match ? parseFloat(match[1]) : 0;
    }
    
    function getPriceText(product) {
      if (product.pricePerKg) return formatPrice(product.pricePerKg);
      if (product.pricePerL) return formatPrice(product.pricePerL);
      if (product.pricePerUnit) return formatPrice(product.pricePerUnit);
      return 'Цена не указана';
    }
    
    function formatPrice(price) {
      return new Intl.NumberFormat('ru-RU').format(price) + ' ₽';
    }
    
    function updateBadges() {
      const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const cartBadge = document.getElementById('cart-badge');
      const favBadge = document.getElementById('fav-badge');
      
      cartBadge.textContent = cartCount;
      cartBadge.classList.toggle('hidden', cartCount === 0);
      
      favBadge.textContent = favorites.size;
      favBadge.classList.toggle('hidden', favorites.size === 0);
    }
    
    function updateUI() {
      updateBadges();
    }
    
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }
    
    function showLoader(text = 'Загрузка...') {
      document.getElementById('loader-text').textContent = text;
      document.getElementById('loader').classList.add('active');
    }
    
    function hideLoader() {
      document.getElementById('loader').classList.remove('active');
    }
    
    function animateFlyToCart(element) {
      const rect = element.getBoundingClientRect();
      const cartBtn = document.querySelector('.nav-item[onclick="openCart()"]');
      const cartRect = cartBtn.getBoundingClientRect();
      
      const flyer = document.createElement('div');
      flyer.className = 'flying-item';
      flyer.style.left = rect.left + 'px';
      flyer.style.top = rect.top + 'px';
      flyer.style.setProperty('--cart-x', (cartRect.left - rect.left) + 'px');
      flyer.style.setProperty('--cart-y', (cartRect.top - rect.top) + 'px');
      
      document.body.appendChild(flyer);
      setTimeout(() => flyer.remove(), 600);
    }
    
    // ===== НАВИГАЦИЯ =====
    function showHome() {
      currentCategory = 'all';
      document.getElementById('search-input').value = '';
      renderCategories();
      renderProducts();
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector('.nav-item[onclick="showHome()"]').classList.add('active');
    }
    
    function showFavorites() {
      const favProducts = PRODUCTS.filter(p => favorites.has(p.id));
      const grid = document.getElementById('products-grid');
      const hitsSection = document.getElementById('hits-section');
      const categoriesSection = document.getElementById('categories-section');
      const emptyState = document.getElementById('empty-state');
      
      hitsSection.classList.add('hidden');
      categoriesSection.classList.add('hidden');
      
      if (favProducts.length === 0) {
        grid.innerHTML = '';
        emptyState.innerHTML = `
          <div class="empty-icon">♡</div>
          <div class="empty-title">Нет избранного</div>
          <p>Добавьте товары в избранное</p>
        `;
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        grid.innerHTML = favProducts.map(p => {
          const isFav = favorites.has(p.id);
          return `
            <div class="product-card" onclick="openProductModal('${p.id}')" data-id="${p.id}">
              <div class="product-image-wrap">
                <img class="product-image" src="${p.img || DEFAULT_IMG}" alt="" loading="lazy">
                <button class="fav-btn ${isFav ? 'active' : ''}" 
                        onclick="event.stopPropagation(); toggleFavorite('${p.id}')">
                  ${isFav ? '♥' : '♡'}
                </button>
                <button class="quick-add" onclick="event.stopPropagation(); quickAdd('${p.id}')">
                  +
                </button>
              </div>
              <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="product-price">${getPriceText(p)}</div>
              </div>
            </div>
          `;
        }).join('');
      }
      
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector('.nav-item[onclick="showFavorites()"]').classList.add('active');
    }
    
    function showProfile() {
      showToast('Профиль в разработке');
    }
    
    // ===== СОБЫТИЯ =====
    function setupEventListeners() {
      // Поиск
      document.getElementById('search-input').addEventListener('input', () => {
        renderProducts();
      });
      
      // Закрытие модалок по Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeProductModal();
          closeCart();
        }
      });
      
      // Сохранение данных формы
      ['checkout-phone', 'checkout-address', 'checkout-comment', 'checkout-promo'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', (e) => {
          checkoutState[id.replace('checkout-', '')] = e.target.value;
          saveState();
        });
      });
      
      document.getElementById('checkout-city')?.addEventListener('change', (e) => {
        checkoutState.city = e.target.value;
        saveState();
      });
    }
  </script>
</body>
</html>
