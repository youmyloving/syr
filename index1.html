<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сыромания — заказ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
:root{
  --bg:#f6f3ee;--surface:#fffefa;--surface-soft:#f1ede5;
  --ink:#211d18;--muted:#81786d;--line:rgba(48,38,26,.10);
  --accent:#7b4f25;--accent-2:#a8743c;--accent-soft:#efe2d0;
  --success:#367b59;--danger:#c94b4b;
  --shadow:0 10px 32px rgba(46,31,15,.075);
  --shadow-lg:0 22px 70px rgba(38,26,14,.18);
  --r:20px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--ink)}
body{margin:0;background:var(--bg);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{width:100%;max-width:1120px;margin:auto;min-height:100vh;min-height:100dvh}
header{
  position:sticky;top:0;z-index:50;
  padding:12px max(14px,env(safe-area-inset-left)) 10px max(14px,env(safe-area-inset-right));
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border-bottom:1px solid var(--line)
}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
#user-profile{display:flex;align-items:center;gap:9px;min-width:0}
.user-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--accent-soft);color:var(--accent);font-weight:900;flex:none}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-title{font-size:23px;font-weight:950;letter-spacing:-.055em;color:var(--ink)}
.search-row{position:relative;margin-bottom:9px}
.search-row:before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:21px;color:var(--muted);pointer-events:none}
.search-row input{
  width:100%;height:46px;border:1px solid var(--line);border-radius:15px;
  background:var(--surface);color:var(--ink);padding:0 16px 0 40px;
  box-shadow:0 3px 14px rgba(42,31,19,.035);font-size:15px
}
.search-row input::placeholder{color:#a69d92}
.filters-row{display:flex;align-items:center;gap:7px;overflow:auto;scrollbar-width:none}
.filters-row::-webkit-scrollbar{display:none}
.filters-row select,.chip{
  height:36px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  color:var(--ink);font-size:12px;font-weight:750;flex:none
}
.filters-row select{min-width:136px;padding:0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 12px;white-space:nowrap}
.chip input{width:15px;height:15px;margin:0;accent-color:var(--accent)}
#favorites-bar{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:7px 0 1px}
#favorites-bar::-webkit-scrollbar{display:none}
#favorites-bar:empty{display:none}
.fav-chip{border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);padding:7px 12px;font-size:11px;font-weight:800;white-space:nowrap}

main{padding:18px 12px calc(112px + env(safe-area-inset-bottom))}
.section{margin:0 0 27px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 2px 11px}
.section-pill{font-size:19px;font-weight:950;letter-spacing:-.035em}
.section-title:after{content:"";height:1px;flex:1;margin-left:13px;background:var(--line)}

.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.product-card{
  position:relative;min-width:0;overflow:hidden;background:var(--surface);
  border:1px solid rgba(50,39,25,.065);border-radius:19px;padding:7px;
  box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
  transition:transform .16s ease,box-shadow .16s ease
}
.product-card:active{transform:scale(.975)}
.product-thumb{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#eee7dc}
.product-thumb:after{content:"";position:absolute;inset:0;box-shadow:inset 0 -28px 35px rgba(0,0,0,.035);pointer-events:none}
.product-thumb img{width:100%;height:100%;display:block;object-fit:cover}
.product-info{padding:8px 5px 4px;display:flex;flex-direction:column;min-height:83px}
.product-card .name{font-size:14px;line-height:1.2;font-weight:850;letter-spacing:-.015em;padding-right:26px}
.product-meta{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:8px}
.price{font-size:14px;font-weight:950;white-space:nowrap}
.badge-piece{font-size:9px;line-height:1.15;padding:4px 6px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-btn{
  position:absolute;right:12px;top:12px;z-index:2;width:32px;height:32px;border:0;border-radius:50%;
  background:rgba(255,254,250,.90);box-shadow:0 4px 12px rgba(30,20,10,.10);
  color:#736a60;font-size:19px;line-height:1;padding:0;cursor:pointer
}
.fav-btn.active{color:#d94b55}
.add-dot{
  position:absolute;right:9px;bottom:10px;width:34px;height:34px;border:0;border-radius:50%;
  background:var(--ink);color:#fff;font-size:21px;line-height:1;display:grid;place-items:center;
  box-shadow:0 5px 14px rgba(0,0,0,.15)
}
.empty{padding:64px 20px;text-align:center;color:var(--muted);font-size:14px}

.cart-footer{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:45;
  width:100%;max-width:1120px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  pointer-events:none
}
.cart-footer-inner{
  pointer-events:auto;display:flex;align-items:center;gap:8px;padding:5px;
  background:rgba(255,254,250,.91);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 14px 45px rgba(33,24,14,.17);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
#open-cart-btn{
  width:100%;height:49px;border:0;border-radius:14px;background:var(--ink);color:#fff;
  font-size:14px;font-weight:900;letter-spacing:-.01em;cursor:pointer
}
#open-cart-btn:disabled{background:#d6d0c8;color:#958d83}

dialog{
  border:0;padding:0;width:min(560px,calc(100% - 20px));max-height:min(88dvh,820px);
  border-radius:24px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg);
  overflow:hidden
}
dialog::backdrop{background:rgba(27,21,15,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;
  border-bottom:1px solid var(--line);background:rgba(255,254,250,.96)
}
.modal-header h2{margin:0;font-size:19px;font-weight:950;letter-spacing:-.04em}
.modal-close{width:34px;height:34px;border:0;border-radius:50%;background:var(--surface-soft);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.modal-body{padding:15px;max-height:calc(min(88dvh,820px) - 61px);overflow:auto}
.product-hero{width:100%;aspect-ratio:1.18/1;border-radius:18px;overflow:hidden;background:#eee7dc;margin-bottom:14px}
.product-hero img{width:100%;height:100%;object-fit:cover;display:block}
.product-desc{font-size:13px;line-height:1.45;color:var(--muted);margin:0 0 15px}
.form-group{margin:0 0 13px}
.form-group label{display:block;font-size:11px;font-weight:850;color:var(--muted);margin:0 0 6px;padding-left:2px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;min-height:46px;border:1px solid var(--line);border-radius:13px;
  background:var(--surface);color:var(--ink);padding:9px 12px;font-size:14px
}
.form-group textarea{min-height:76px;resize:vertical}
.notice{font-size:11px;line-height:1.4;color:var(--muted);margin:5px 2px 0}
.notice.small{font-size:10px}
.custom-weight-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.custom-weight-toggle{display:flex!important;align-items:center;gap:6px!important;font-size:11px!important;color:var(--muted)!important;font-weight:650!important}
.custom-weight-toggle input{width:16px!important;min-height:16px!important;margin:0!important;padding:0!important}
.custom-weight-input-wrap{display:flex;align-items:center;gap:8px;padding:6px 11px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-soft);margin-top:6px}
.custom-weight-input-wrap.enabled{border-style:solid;background:var(--surface)}
.custom-weight-input-wrap input{border:0!important;background:transparent!important;padding:0!important;min-height:34px!important;flex:1}
.custom-weight-unit{font-size:12px;color:var(--muted)}
.piece-badge{font-size:11px;color:var(--muted);margin-top:4px}
.price-display{font-size:25px;font-weight:950;letter-spacing:-.045em;margin:14px 0}
.btn{min-height:48px;border:0;border-radius:14px;padding:0 16px;font-size:14px;font-weight:900;cursor:pointer}
.btn-primary{width:100%;background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(30,23,16,.14)}
.btn-primary:disabled{opacity:.55;box-shadow:none}
.cart-item{
  display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--line)
}
.cart-item-name{font-size:14px;font-weight:850}
.cart-item-variant{font-size:11px;color:var(--muted);margin-top:3px}
.cart-item-price{font-size:13px;font-weight:900;margin-top:5px}
.qty-control{display:inline-flex;align-items:center;height:36px;border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden}
.qty-control button{width:35px;height:35px;border:0;background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.qty-control span{min-width:25px;text-align:center;font-size:13px;font-weight:850}
.discount-hint{font-size:10px;color:var(--success);margin-top:3px;font-weight:700}
.cart-summary{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:17px;font-weight:950}
.promo-block{margin-top:13px;font-weight:400;display:flex;gap:7px}
.promo-block label{display:none}
.promo-block input{
  min-width:0;flex:1;height:43px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);padding:0 12px;font-size:13px
}
.checkout-title{font-size:16px;font-weight:950;letter-spacing:-.03em;margin:20px 0 12px}
.error-text{font-size:12px;color:var(--danger);margin:7px 2px}
.weighing-note{margin-top:10px;padding:10px 11px;border-radius:12px;background:var(--accent-soft);font-size:11px;line-height:1.35;color:var(--accent);font-weight:700}
@media(min-width:620px){
  header{padding-left:20px;padding-right:20px}
  main{padding-left:20px;padding-right:20px}
  .product-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
  .product-card .name{font-size:15px}
}
@media(min-width:900px){
  .product-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
  main{padding-top:22px}
}
@media(max-width:380px){
  header{padding-left:9px;padding-right:9px}
  main{padding-left:7px;padding-right:7px}
  .product-grid{gap:7px}
  .product-card{padding:6px;border-radius:17px}
  .product-card .name{font-size:12.5px}
  .price{font-size:12px}
  .add-dot{width:31px;height:31px;right:8px;bottom:8px}
  .fav-btn{right:10px;top:10px;width:30px;height:30px}
}
@media(max-width:340px){
  .product-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  dialog{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;width:100%;max-width:none;
    max-height:92dvh;border-radius:24px 24px 0 0;animation:sheet .2s ease-out}
  dialog::backdrop{background:rgba(20,16,11,.42)}
  .modal-body{max-height:calc(92dvh - 61px);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .product-hero{aspect-ratio:1.35/1}
}
@keyframes sheet{from{transform:translateY(18px);opacity:.7}to{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="top-row">
        <div id="user-profile">
          <div class="user-avatar"><span>С</span></div>
          <div class="user-name">Сыромания</div>
        </div>
        <div class="header-title">Сыромания</div>
      </div>
      <div class="search-row">
        <input id="search-input" type="search" placeholder="Найти сыр или десерт" autocomplete="off" />
      </div>
      <div class="filters-row">
        <select id="category-filter" aria-label="Категория">
          <option value="">Все товары</option>
        </select>
        <label class="chip">
          <input type="checkbox" id="only-cheese-checkbox" />
          <span>Сыры</span>
        </label>
        <label class="chip">
          <input type="checkbox" id="only-fav-checkbox" />
          <span>♥</span>
        </label>
      </div>
      <div id="favorites-bar"></div>
    </header>

    <main id="main"></main>

    <div class="cart-footer">
      <div class="cart-footer-inner">
        <button id="open-cart-btn" disabled>Корзина</button>
      </div>
    </div>
  </div>

  <dialog id="product-modal">
    <div class="modal-header">
      <h2 id="product-modal-title"></h2>
      <button class="modal-close" type="button" onclick="closeProductModal()" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body">
      <div class="product-hero"><img id="product-modal-image" src="" alt=""></div>
      <div class="product-desc" id="product-modal-description"></div>

      <div class="form-group">
        <label for="product-variant-select">Выберите вес</label>
        <select id="product-variant-select"></select>
        <div class="notice" id="variant-hint"></div>
        <div class="piece-badge" id="piece-badge" style="display:none"></div>
      </div>

      <div class="form-group custom-weight-block" id="custom-weight-block">
        <div class="custom-weight-header">
          <span style="font-size:13px;font-weight:800">Свой вес</span>
          <label class="custom-weight-toggle">
            <input type="checkbox" id="custom-weight-checkbox" />
            <span>Указать</span>
          </label>
        </div>
        <div class="custom-weight-input-wrap" id="custom-weight-input-wrap">
          <input type="number" id="product-custom-weight" min="1" step="1" placeholder="200" disabled />
          <span class="custom-weight-unit">г</span>
        </div>
      </div>

      <div class="form-group" id="flavor-group" style="display:none">
        <label for="product-flavor-select">Вкус</label>
        <select id="product-flavor-select"></select>
      </div>

      <div class="form-group">
        <label for="product-qty-input">Количество</label>
        <input type="number" id="product-qty-input" value="1" min="1" inputmode="numeric" />
      </div>

      <div class="price-display" id="product-modal-price">0 ₽</div>
      <button class="btn btn-primary" id="add-to-cart-btn" type="button">Добавить в корзину</button>
    </div>
  </dialog>

  <dialog id="cart-modal">
    <div class="modal-header">
      <h2>Ваш заказ</h2>
      <button class="modal-close" type="button" onclick="closeCartModal()" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body" id="cart-modal-body"></div>
  </dialog>

      // ===== STATE =====
      let cart = [];
      let favorites = new Set();
      let currentProduct = null;
      let filteredProducts = [];
      let checkoutState = { phone:'', address:'', comment:'', promo:'', city:'Пенза' };

      document.addEventListener('DOMContentLoaded', init);

      function init(){
        loadState();
        setupEventListeners();
        setupTelegramWebApp();
        renderUserProfile();
        populateCategoryFilter();
        document.getElementById('only-cheese-checkbox').checked = ONLY_CHEESE_FILTER_DEFAULT;
        refreshFavoritesBar();
        filterAndRender();
        updateCartUI();
      }

      function loadState(){
        try{
          const savedCart = localStorage.getItem(STORAGE_CART_KEY);
          if(savedCart) cart = JSON.parse(savedCart);
        }catch(e){}
        try{
          const savedFav = localStorage.getItem(STORAGE_FAV_KEY);
          if(savedFav) favorites = new Set(JSON.parse(savedFav));
        }catch(e){}
        try{
          const savedCheckout = localStorage.getItem(STORAGE_CHECKOUT_KEY);
          if(savedCheckout) checkoutState = { ...checkoutState, ...JSON.parse(savedCheckout) };
        }catch(e){}
      }

      function saveState(){
        try{ localStorage.setItem(STORAGE_CART_KEY, JSON.stringify(cart)); }catch(e){}
        try{ localStorage.setItem(STORAGE_FAV_KEY, JSON.stringify([...favorites])); }catch(e){}
        try{ localStorage.setItem(STORAGE_CHECKOUT_KEY, JSON.stringify(checkoutState)); }catch(e){}
      }

      function setupTelegramWebApp(){
        if(window.Telegram && window.Telegram.WebApp){
          const webApp = window.Telegram.WebApp;
          webApp.ready();
          webApp.expand();
          applyTheme();
          webApp.MainButton.setText('Оформить заказ').onClick(()=> openCartModal()).hide();
          webApp.BackButton.onClick(()=>{
            const pm = document.getElementById('product-modal');
            const cm = document.getElementById('cart-modal');
            if(cm.open) closeCartModal();
            else if(pm.open) closeProductModal();
          });
        } else {
          applyTheme();
        }
      }

      function applyTheme(){
        // всё оформлено через CSS-переменные
      }

      function setupEventListeners(){
        el('search-input').addEventListener('input', filterAndRender);
        el('category-filter').addEventListener('change', filterAndRender);
        el('only-cheese-checkbox').addEventListener('change', filterAndRender);
        el('only-fav-checkbox').addEventListener('change', filterAndRender);
        el('open-cart-btn').addEventListener('click', openCartModal);

        el('add-to-cart-btn').addEventListener('click', addToCart);
        el('product-variant-select').addEventListener('change', updateProductModalPrice);
        el('product-qty-input').addEventListener('input', updateProductModalPrice);
        el('custom-weight-checkbox').addEventListener('change', handleCustomWeightToggle);
        el('product-custom-weight').addEventListener('input', updateProductModalPrice);
      }

      function renderUserProfile(){
        const box = el('user-profile');
        const ua = window.Telegram?.WebApp?.initDataUnsafe?.user;
        if(ua){
          const initial = (ua.first_name || ua.username || 'U').charAt(0).toUpperCase();
          box.innerHTML = `
            <div class="user-avatar">
              ${ua.photo_url ? `<img src="${ua.photo_url}" alt="avatar" onerror="this.remove()">` : `<span>${initial}</span>`}
            </div>
            <div class="user-name">${ua.first_name || ''}</div>`;
        } else {
          box.style.display='none';
        }
      }

      function populateCategoryFilter(){
        const select = el('category-filter');
        GROUPS.forEach(g=>{
          const o = document.createElement('option');
          o.value = g.id;
          o.textContent = g.title;
          select.appendChild(o);
        });
      }

      function filterAndRender(){
        const term = el('search-input').value.trim().toLowerCase();
        const groupSel = el('category-filter').value;
        const onlyCheese = el('only-cheese-checkbox').checked;
        const onlyFav = el('only-fav-checkbox').checked;

        filteredProducts = PRODUCTS.filter(p=>{
          const inTerm   = !term || p.name.toLowerCase().includes(term);
          const inGroup  = !groupSel || p.group === groupSel;
          const inCheese = !onlyCheese || CHEESE_GROUP_IDS.has(p.group);
          const inFav    = !onlyFav || favorites.has(p.id);
          return hasPrice(p) && inTerm && inGroup && inCheese && inFav;
        });

        const showSections = term==='' && !groupSel && !onlyCheese && !onlyFav;
        renderMain(showSections);
      }

      function renderMain(showSections){
        const main = el('main');
        main.innerHTML = '';
        if(!filteredProducts.length){
          main.innerHTML = '<p class="empty">Ничего не найдено</p>';
          return;
        }

        if(showSections){
          GROUPS.forEach(g=>{
            const items = filteredProducts.filter(p=>p.group === g.id);
            if(!items.length) return;
            const section = document.createElement('section');
            section.className = 'section';
            section.innerHTML = `<div class="section-title"><span class="section-pill">${g.title}</span></div>`;
            const grid = document.createElement('div');
            grid.className = 'product-grid';
            items.forEach(p=> grid.appendChild(productCard(p)));
            section.appendChild(grid);
            main.appendChild(section);
          });
        } else {
          const grid = document.createElement('div');
          grid.className = 'product-grid';
          filteredProducts.forEach(p=> grid.appendChild(productCard(p)));
          main.appendChild(grid);
        }
      }

      function productCard(p){
        const card = document.createElement('article');
        card.className = 'product-card';
        card.onclick = (e)=>{
          if(e.target.closest('.fav-btn')) return;
          openProductModal(p.id);
        };
        const priceText = getPriceText(p);
        const approx = approxPieceBadgeText(p);
        const favActive = favorites.has(p.id) ? 'active' : '';
        card.innerHTML = `
          <div class="product-thumb">
            <img src="${p.img || DEFAULT_IMG}" alt="${escapeHtml(p.name)}" loading="lazy"
                 onerror="this.src='${DEFAULT_IMG}'">
            <button class="fav-btn ${favActive}" type="button" aria-label="Избранное"
              onclick="event.stopPropagation(); window.toggleFavorite && window.toggleFavorite('${p.id}')">
              ${favActive ? '♥' : '♡'}
            </button>
            <button class="add-dot" type="button" aria-label="Добавить"
              onclick="event.stopPropagation(); openProductModal('${p.id}')">+</button>
          </div>
          <div class="product-info">
            <div class="name">${p.name}</div>
            <div class="product-meta">
              <div class="price">${priceText}</div>
              ${approx ? `<div class="badge-piece">${approx}</div>` : ''}
            </div>
          </div>`;
        return card;
      }

      window.toggleFavorite = toggleFavorite;

      function refreshFavoritesBar(){
        const bar = el('favorites-bar');
        bar.innerHTML = '';
        if(!favorites.size){
          bar.style.display='none';
          return;
        }
        bar.style.display='flex';
        [...favorites].forEach(id=>{
          const p = PRODUCTS.find(x=>x.id===id);
          if(!p) return;
          const chip = document.createElement('button');
          chip.type='button';
          chip.className='fav-chip';
          chip.textContent=p.name;
          chip.onclick = ()=> openProductModal(id);
          bar.appendChild(chip);
        });
      }

      function toggleFavorite(id){
        if(favorites.has(id)) favorites.delete(id);
        else favorites.add(id);
        saveState();
        refreshFavoritesBar();
        filterAndRender();
      }

      function openProductModal(productId){
        currentProduct = PRODUCTS.find(p=>p.id===productId);
        if(!currentProduct) return;

        resetCustomWeightControls();

        el('product-modal-title').textContent = currentProduct.name;
        el('product-modal-description').textContent = currentProduct.description || '';
        const modalImg = el('product-modal-image');
        modalImg.src = currentProduct.img || DEFAULT_IMG;
        modalImg.alt = currentProduct.name;

        renderVariantSelector();
        renderFlavorSelector();
        updateVariantHint();
        updateProductModalPrice();

        const cwBlock = el('custom-weight-block');
        if(currentProduct.pricePerKg) cwBlock.style.display='block';
        else cwBlock.style.display='none';

        el('product-modal').showModal();
        window.Telegram?.WebApp?.BackButton.show?.();
      }

      function closeProductModal(){
        el('product-modal').close();
        currentProduct = null;
        window.Telegram?.WebApp?.BackButton.hide?.();
      }

      function renderVariantSelector(){
        const select = el('product-variant-select');
        select.innerHTML = '';
        const pieceBadge = el('piece-badge');
        pieceBadge.style.display='none';

        const rule = VARIANT_RULES[currentProduct.id];

        if(rule){
          if(rule.type === 'fixed'){
            rule.options.forEach(opt=>{
              const o = document.createElement('option');
              o.value = opt;
              o.textContent = opt;
              select.appendChild(o);
            });
          } else if(rule.type === 'weight'){
            for(let g=rule.min; g<=rule.max; g+=rule.step){
              const o = document.createElement('option');
              o.value = `${g} ${rule.unit}`;
              o.textContent = `${g} ${rule.unit}`;
              select.appendChild(o);
            }
          }
        } else {
          if(currentProduct.pricePerKg){
            [200,300,500,1000].forEach(g=>{
              const o = document.createElement('option');
              o.value = `${g} г`;
              o.textContent = `${g} г`;
              select.appendChild(o);
            });
          } else if(currentProduct.pricePerL){
            [0.5,1].forEach(l=>{
              const o = document.createElement('option');
              o.value = `${l} л`;
              o.textContent = `${l} л`;
              select.appendChild(o);
            });
          } else if(currentProduct.pricePerUnit){
            const o = document.createElement('option');
            o.value = '1 шт';
            o.textContent = '1 шт';
            select.appendChild(o);
          }
        }

        const approx = approxPieceBadgeText(currentProduct);
        if(approx){
          pieceBadge.textContent = approx;
          pieceBadge.style.display='block';
        }

        el('product-qty-input').value = 1;
      }

      function renderFlavorSelector(){
        const groupEl = el('flavor-group');
        const selectEl = el('product-flavor-select');
        if(currentProduct && Array.isArray(currentProduct.flavors) && currentProduct.flavors.length){
          groupEl.style.display='block';
          selectEl.innerHTML='';
          currentProduct.flavors.forEach(fl=>{
            const o = document.createElement('option');
            o.value = fl;
            o.textContent = fl;
            selectEl.appendChild(o);
          });
        } else {
          groupEl.style.display='none';
          if(selectEl) selectEl.innerHTML='';
        }
      }

      function resetCustomWeightControls(){
        const cb = el('custom-weight-checkbox');
        const wrap = el('custom-weight-input-wrap');
        const input = el('product-custom-weight');
        cb.checked = false;
        wrap.classList.remove('enabled');
        input.disabled = true;
        input.value = '';
      }

      function handleCustomWeightToggle(){
        if(!currentProduct || !currentProduct.pricePerKg){
          this.checked = false;
          return;
        }
        const wrap = el('custom-weight-input-wrap');
        const input = el('product-custom-weight');
        if(this.checked){
          wrap.classList.add('enabled');
          input.disabled = false;
          if(!input.value){
            let grams = 0;
            const rule = VARIANT_RULES[currentProduct.id];
            const variantVal = el('product-variant-select').value;
            grams = extractGrams(variantVal);
            if(!grams){
              if(rule && rule.type==='weight') grams = rule.min;
              else if(currentProduct.pieceWeightGrams) grams = currentProduct.pieceWeightGrams;
              else grams = 200;
            }
            input.value = grams;
          }
          input.focus();
        } else {
          wrap.classList.remove('enabled');
          input.disabled = true;
        }
        updateProductModalPrice();
      }

      function updateVariantHint(){
        const hintEl = el('variant-hint');
        if(!hintEl || !currentProduct) return;
        let text = '';
        const rule = VARIANT_RULES[currentProduct.id];
        if(currentProduct.pricePerKg){
          if(rule && rule.type === 'weight'){
            text = 'Шаг 50 г в списке. Можно указать любой свой вес — цена и скидки пересчитаются автоматически.';
          } else if(currentProduct.pieceWeightRangeText){
            text = `Вес одной штуки обычно ${currentProduct.pieceWeightRangeText}. Можно указать свой вес.`;
          } else if(currentProduct.pieceWeightGrams){
            text = `Вес одной штуки примерно ${currentProduct.pieceWeightGrams} г. Можно указать свой вес.`;
          } else {
            text = 'Можно указать свой вес в граммах — посчитаем стоимость за любой вес.';
          }
        } else if(currentProduct.pricePerL){
          text = 'Объём в литрах. Для молочных напитков свой объём не выбираем.';
        }
        hintEl.textContent = text;
      }

      function getSelectedVariantAndQty(){
        const qty = Math.max(1, parseInt(el('product-qty-input').value,10) || 1);
        let variant = el('product-variant-select').value || '';
        const canCustom = currentProduct && currentProduct.pricePerKg;
        const useCustom = canCustom && el('custom-weight-checkbox').checked;
        if(useCustom){
          const grams = Math.max(1, parseInt(el('product-custom-weight').value,10) || 0);
          if(grams>0){
            variant = `${grams} г (свой вес)`;
          }
        }
        return { variant, qty };
      }

      function updateProductModalPrice(){
        if(!currentProduct) return;
        const { variant, qty } = getSelectedVariantAndQty();
        const { finalPrice } = calculatePrice(currentProduct.id, variant, qty);
        el('product-modal-price').textContent = fmtRub(finalPrice);
      }

      function addToCart(){
        if(!currentProduct) return;
        const { variant, qty } = getSelectedVariantAndQty();
        let fullVariant = variant;
        const flavorWrap = el('flavor-group');
        const flavorSelect = el('product-flavor-select');
        if(flavorWrap && flavorWrap.style.display !== 'none' && flavorSelect && flavorSelect.value){
          fullVariant = `${variant} · вкус: ${flavorSelect.value}`;
        }

        const idx = cart.findIndex(i=> i.id===currentProduct.id && i.variant===fullVariant);
        if(idx>-1){
          cart[idx].qty += qty;
        } else {
          cart.push({ id:currentProduct.id, name:currentProduct.name, group:currentProduct.group, variant:fullVariant, qty });
        }

        saveState();
        updateCartUI();
        closeProductModal();
        window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('medium');
      }

      function updateCartUI(){
        const totalCount = cart.reduce((s,i)=> s+i.qty, 0);
        const totalSum = cart.reduce((s,i)=> s+calculatePrice(i.id,i.variant,i.qty).finalPrice, 0);
        const btn = el('open-cart-btn');
        if(cart.length){
          btn.disabled = false;
          btn.textContent = `Корзина (${totalCount}) — ${fmtRub(totalSum)}`;
          window.Telegram?.WebApp?.MainButton.show?.();
        } else {
          btn.disabled = true;
          btn.textContent = 'Корзина пуста';
          window.Telegram?.WebApp?.MainButton.hide?.();
        }
      }

      function openCartModal(){
        renderCartModal();
        el('cart-modal').showModal();
        window.Telegram?.WebApp?.BackButton.show?.();
      }

      function closeCartModal(){
        el('cart-modal').close();
        window.Telegram?.WebApp?.BackButton.hide?.();
      }

      function renderCartModal(){
        const body = el('cart-modal-body');
        body.innerHTML = '';
        if(!cart.length){
          body.innerHTML = '<div class="empty">Корзина пуста</div>';
          return;
        }

        let total = 0;
        cart.forEach((item,idx)=>{
          const price = calculatePrice(item.id,item.variant,item.qty);
          total += price.finalPrice;
          const rate = getDiscountRateForProduct(item.id);
          const hint = rate>0 ? `<div class="discount-hint">Скидка ${Math.round(rate*100)}%</div>` : '';
          const row = document.createElement('div');
          row.className='cart-item';
          row.innerHTML=`
            <div>
              <div class="cart-item-name">${escapeHtml(item.name)}</div>
              <div class="cart-item-variant">${escapeHtml(item.variant)}</div>
              <div class="cart-item-price">${fmtRub(price.finalPrice)}</div>
              ${hint}
            </div>
            <div class="qty-control">
              <button type="button" onclick="window.changeItemQty && window.changeItemQty(${idx},-1)">−</button>
              <span>${item.qty}</span>
              <button type="button" onclick="window.changeItemQty && window.changeItemQty(${idx},1)">+</button>
            </div>`;
          body.appendChild(row);
        });

        const summary = document.createElement('div');
        summary.className='cart-summary';
        summary.innerHTML=`
          <div>Итого <span style="float:right">${fmtRub(total)}</span></div>
          <div class="promo-block">
            <input id="checkout-promo" placeholder="Промокод" autocomplete="off" />
          </div>`;
        body.appendChild(summary);

        const checkout = document.createElement('div');
        checkout.innerHTML=`
          <div class="checkout-title">Доставка</div>
          <div class="form-group">
            <label for="checkout-city">Город</label>
            <select id="checkout-city">
              <option value="Пенза">Пенза</option>
              <option value="Москва">Москва</option>
            </select>
          </div>
          <div class="form-group">
            <label for="checkout-phone">Телефон</label>
            <input type="tel" id="checkout-phone" inputmode="tel" autocomplete="tel" placeholder="+7 999 999-99-99" />
          </div>
          <div class="form-group">
            <label for="checkout-address">Адрес</label>
            <textarea id="checkout-address" rows="3" placeholder="Улица, дом, квартира"></textarea>
          </div>
          <div class="form-group">
            <label for="checkout-comment">Комментарий</label>
            <textarea id="checkout-comment" rows="2" placeholder="Пожелания к заказу"></textarea>
          </div>
          <div id="checkout-errors" class="error-text" style="display:none"></div>`;
        body.appendChild(checkout);

        el('checkout-phone').value=checkoutState.phone||'';
        el('checkout-address').value=checkoutState.address||'';
        el('checkout-comment').value=checkoutState.comment||'';
        el('checkout-promo').value=checkoutState.promo||'';
        el('checkout-city').value=checkoutState.city||'Пенза';

        el('checkout-phone').addEventListener('input',()=>{checkoutState.phone=el('checkout-phone').value;saveState();});
        el('checkout-address').addEventListener('input',()=>{checkoutState.address=el('checkout-address').value;saveState();});
        el('checkout-comment').addEventListener('input',()=>{checkoutState.comment=el('checkout-comment').value;saveState();});
        el('checkout-promo').addEventListener('input',()=>{checkoutState.promo=el('checkout-promo').value.trim();saveState();});
        el('checkout-city').addEventListener('change',()=>{checkoutState.city=el('checkout-city').value;saveState();});

        const sendBtn=document.createElement('button');
        sendBtn.type='button';sendBtn.className='btn btn-primary';sendBtn.textContent='Оформить заказ';
        sendBtn.onclick=sendOrder;
        body.appendChild(sendBtn);

        if(hasCheeseInCart()){
          const note=document.createElement('div');
          note.className='weighing-note';
          note.textContent='Стоимость сыра уточняется после фактического взвешивания.';
          body.appendChild(note);
        }
      }

      function changeItemQty(index,delta){
        if(!cart[index]) return;
        cart[index].qty += delta;
        if(cart[index].qty<=0) cart.splice(index,1);
        saveState();
        updateCartUI();
        renderCartModal();
      }
      window.changeItemQty = changeItemQty;

      function hasPrice(p){
        return !!(p.pricePerKg || p.pricePerL || p.pricePerUnit);
      }

      function getPriceText(p){
        if(p.pricePerKg) return `${fmtRub(p.pricePerKg)} / кг`;
        if(p.pricePerL)  return `${fmtRub(p.pricePerL)} / л`;
        if(p.pricePerUnit) return `${fmtRub(p.pricePerUnit)}`;
        return 'Цена не указана';
      }

      function approxPieceBadgeText(p){
        if(!p || !p.pricePerKg || !p.pieceWeightGrams) return '';
        const approx = Math.round(p.pricePerKg * p.pieceWeightGrams / 1000);
        const range = p.pieceWeightRangeText ? ` (${p.pieceWeightRangeText})` : '';
        return `≈ ${fmtRub(approx)} за 1 шт${range}`;
      }

      function extractGrams(variant){
        const m = (variant||'').match(/(?:\(|^|\s)[~±≈]?\s*(\d+(?:\.\d+)?)\s*(г|кг)/i);
        if(!m) return 0;
        const val = parseFloat(m[1]);
        const unit = m[2].toLowerCase();
        return unit==='кг' ? val*1000 : val;
      }

      function extractLiters(variant){
        const m = (variant||'').match(/(\d+(?:\.\d+)?)\s*л/i);
        return m ? parseFloat(m[1]) : 0;
      }

      function calculatePrice(productId, variant, qty){
        const p = PRODUCTS.find(x=>x.id===productId);
        if(!p) return { basePrice:0, finalPrice:0, discountRate:0 };
        let base = 0;

        if(p.pricePerKg){
          const grams = extractGrams(variant) || 0;
          base = (grams>0 ? (grams/1000)*p.pricePerKg : p.pricePerKg) * qty;
        } else if(p.pricePerL){
          const liters = extractLiters(variant) || 1;
          base = liters * p.pricePerL * qty;
        } else if(p.pricePerUnit){
          base = p.pricePerUnit * qty;
        }

        const discountRate = getDiscountRateForProduct(productId);
        const discounted = base * (1 - discountRate);
        return { basePrice:ROUND(base), finalPrice:ROUND(discounted), discountRate };
      }

      function getDiscountRateForProduct(productId){
        const prod = PRODUCTS.find(p=>p.id===productId);
        if(!prod || !CHEESE_GROUP_IDS.has(prod.group)) return 0;
        const totalGr = cart
          .filter(i=> i.id===productId)
          .reduce((sum,i)=> sum + (extractGrams(i.variant)||0)*i.qty, 0);
        let rate = 0;
        for(const t of DISCOUNT_THRESHOLDS){
          if(totalGr >= t.g) rate = t.rate;
        }
        return rate;
      }

      function hasCheeseInCart(){
        return cart.some(i=>{
          const p = PRODUCTS.find(x=>x.id===i.id);
          return p && CHEESE_GROUP_IDS.has(p.group);
        });
      }

      function normalizePhone(input){
        if(!input) return '';
        const digits = String(input).replace(/\D+/g,'');
        if(digits.length===11 && (digits.startsWith('7') || digits.startsWith('8'))) return '+7'+digits.slice(1);
        if(digits.length===10) return '+7'+digits;
        if(String(input).trim().startsWith('+')) return '+'+digits;
        return digits ? '+'+digits : '';
      }

      function getCheckoutData(){
        const phoneRaw = (el('checkout-phone').value || '').trim();
        const phone    = normalizePhone(phoneRaw);
        const address  = (el('checkout-address').value || '').trim();
        const comment  = (el('checkout-comment').value || '').trim();
        const promo    = (el('checkout-promo').value || '').trim().toUpperCase();
        const city     = (el('checkout-city').value || 'Пенза');

        checkoutState = { phone:phoneRaw, address, comment, promo, city };
        saveState();

        return { phoneRaw, phone, address, comment, promo, city };
      }

      function validateCheckout(data){
        const errs = [];
        if(!data.phone) errs.push('Укажите корректный телефон для связи.');
        if(!data.address || data.address.length<5) errs.push('Пожалуйста, укажите адрес доставки.');
        if(!data.city) errs.push('Выберите город доставки.');
        return errs;
      }

      function showCheckoutErrors(errors){
        const box = el('checkout-errors');
        if(!errors || !errors.length){
          box.style.display='none';
          box.textContent='';
          return;
        }
        box.style.display='block';
        box.textContent = errors.join(' ');
      }

      function applyPromo(total, code){
        if(!code) return { total, applied:null };
        const promo = PROMO_CODES[code];
        if(!promo) return { total, applied:null };
        let newTotal = total;
        if(promo.type==='percent') newTotal = total*(1 - promo.value/100);
        if(promo.type==='fixed')   newTotal = Math.max(0, total - promo.value);
        return { total:ROUND(newTotal), applied:promo };
      }

      function sendOrder(){
        if(!cart.length) return;
        const contact = getCheckoutData();
        const errors  = validateCheckout(contact);
        if(errors.length){
          showCheckoutErrors(errors);
          window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.('error');
          return;
        }
        showCheckoutErrors([]);

        const payload = {
          type:'cart',
          source:'miniapp',
          currency:CURRENCY,
          items:[],
          total:0,
          contact:{
            phone:contact.phone,
            phone_raw:contact.phoneRaw,
            address:contact.address,
            comment:contact.comment,
            promo:contact.promo,
            city:contact.city,
          },
          meta:{ ts:Date.now(), schema_ver:PAYLOAD_SCHEMA_VERSION }
        };

        let grand = 0;
        cart.forEach(i=>{
          const price = calculatePrice(i.id,i.variant,i.qty);
          grand += price.finalPrice;
          payload.items.push({
            id:i.id,
            name:i.name,
            group:i.group,
            variant:i.variant,
            qty:i.qty,
            unit_price_base: price.basePrice/Math.max(i.qty,1),
            discount_rate:   price.discountRate,
            unit_price:      price.finalPrice/Math.max(i.qty,1),
            line_total:      price.finalPrice,
          });
        });

        const promoRes = applyPromo(grand, contact.promo);
        payload.total = promoRes.total;
        if(promoRes.applied) payload.promo_applied = promoRes.applied;

        if(window.Telegram?.WebApp){
          const tg = window.Telegram.WebApp;
          payload.telegram = { platform:tg.platform, init_data:!!tg.initData };
          const u = tg.initDataUnsafe?.user;
          if(u){
            payload.telegram.user = {
              id:u.id,
              username:u.username,
              first_name:u.first_name,
              last_name:u.last_name
            };
          }
        }

        if(typeof axios === 'undefined'){
          window.Telegram?.WebApp?.showAlert?.('Не удалось подготовить заказ. Попробуйте ещё раз.');
          return;
        }

        axios.post(`${BACKEND}/order`, payload)
          .then(()=>{
            window.Telegram?.WebApp?.showAlert?.('Спасибо! Ваш заказ принят. Мы свяжемся по телефону для подтверждения.');
            window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.('success');
            cart = [];
            saveState();
            updateCartUI();
            closeCartModal();
            window.Telegram?.WebApp?.close?.();
          })
          .catch(()=>{
            window.Telegram?.WebApp?.showAlert?.('Не удалось отправить заказ. Проверьте интернет и попробуйте ещё раз.');
            window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.('error');
          });
      }

      function el(id){ return document.getElementById(id); }

      function escapeHtml(str){
        return String(str||'').replace(/[&<>\"']/g, m=>({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        }[m]));
      }

    })();
  </script>
</body>
</html>
